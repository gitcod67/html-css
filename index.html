<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeroporto Internacional</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        header {
            background-color: #004080;
            color: white;
            padding: 20px 0;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            background-color: #0066cc;
        }

        nav a {
            color: white;
            padding: 15px 20px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            background-color: #004080;
        }

        section {
            padding: 50px 20px;
            max-width: 1000px;
            margin: auto;
        }

        h2 {
            color: #004080;
        }

        .flights-table {
            width: 100%;
            border-collapse: collapse;
        }

        .flights-table th, .flights-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        .flights-table th {
            background-color: #0066cc;
            color: white;
        }

        footer {
            background-color: #004080;
            color: white;
            text-align: center;
            padding: 20px 0;
        }

        .map-container {
            text-align: center;
        }

        .map-container iframe {
            width: 80%;
            height: 400px;
            border: none;
        }

        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        .contact-form button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
        }

        .contact-form button:hover {
            background-color: #004080;
        }
    </style>
</head>
<body>
    
</body>
</html>
